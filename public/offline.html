<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Edway</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #050614;
        color: #e8e8f0;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        font-size: 30px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 10px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #a7a7bd;
      }
      button {
        border: 0;
        cursor: pointer;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">✦</div>
      <h1>You're offline</h1>
      <p>
        We can't reach Edway right now. Your progress is saved on this device — once
        you're back online, pick up exactly where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
