# CI gate for a push-to-production repo: every push to main also triggers a
# Vercel deploy, so this workflow is the record of whether that deploy was
# built from green code. No secrets — the build must tolerate missing env vars
# (feature keys degrade gracefully by design).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
